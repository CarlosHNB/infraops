function defaultState(){

}
let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){ /* ambiente sem storage — segue só em memória */ }
}

/* ---------- helpers de progresso ---------- */
function phaseProgress(phase){
  const lessons = phase.modules.flatMap(m=>m.lessons);
  if(lessons.length===0) return 0;
  const done = lessons.filter(l=>STATE.lessonsDone[l.id]).length;
  return Math.round((done/lessons.length)*100);
}
function overallProgress(){
  const lessons = allLessons();
  const done = lessons.filter(l=>STATE.lessonsDone[l.id]).length;
  return lessons.length ? Math.round((done/lessons.length)*100) : 0;
}
function areaProgress(){
  // agrupa fases correlatas em áreas para o dashboard
  const groups = {
    'Linux': ['f0','f1','f2'],
    'Storage': ['f3'],
    'Networking': ['f4'],
    'Bash & Git': ['f5'],
    'Ansible': ['f6'],
    'Containers': ['f7'],
    'Security': ['f8','f12','f13'],
    'Monitoring': ['f9'],
    'Cloud': ['f11'],
  };
  return Object.entries(groups).map(([name,ids])=>{
    const phases = PHASES.filter(p=>ids.includes(p.id));
    const lessons = phases.flatMap(p=>p.modules.flatMap(m=>m.lessons));
    const done = lessons.filter(l=>STATE.lessonsDone[l.id]).length;
    return {name, pct: lessons.length ? Math.round((done/lessons.length)*100) : 0};
  });
}
function nextAction(){
  for(const p of PHASES){
    for(const m of p.modules){
      for(const l of m.lessons){
        if(!STATE.lessonsDone[l.id]){
          return {phase:p, module:m, lesson:l};
        }
      }
    }
  }
  return null;
}
function skillProofCount(skillId){
  const p = STATE.skillProof[skillId] || {};
  return PROOF_STEPS.filter((_,i)=>p[i]).length;
}
function isSkillMastered(skillId){ return skillProofCount(skillId) === PROOF_STEPS.length; }

function streakInfo(){
  const days = [...new Set(STATE.studyLog.map(s=>s.date))].sort();
  if(days.length===0) return {count:0,last:null};
  let count=1;
  for(let i=days.length-1;i>0;i--){
    const cur = new Date(days[i]), prev = new Date(days[i-1]);
    const diff = (cur-prev)/86400000;
    if(diff===1) count++; else break;
  }
  return {count, last:days[days.length-1]};
}
function totalHours(){ return STATE.studyLog.reduce((s,l)=>s+Number(l.hours||0),0); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

   ========================================================================= */
const labUiState = {}; // id -> {hintsShown, solutionShown}
function renderLabs(){
  return `
  ${sectionHeader('Laboratório', 'Cada lab só mostra a solução depois que você pedir hints — o objetivo é te obrigar a pensar antes.')}
  <div class="grid md:grid-cols-2 gap-4">
    ${LABS.map(lab=>renderLabCard(lab)).join('')}
  </div>`;
}
function renderLabCard(lab){
  const ui = labUiState[lab.id] || {hints:0, solution:false};
  labUiState[lab.id] = ui;
  const done = STATE.labsDone[lab.id];
  const levelColor = lab.level==='Beginner'?'green':lab.level==='Intermediate'?'amber':'red';
  return `
  <div class="card rounded-xl p-5" id="lab-${lab.id}">
    <div class="flex items-start justify-between gap-3 mb-1">
      <h3 class="font-display font-semibold text-ink">${lab.title}</h3>
      <label class="flex items-center gap-2 shrink-0 cursor-pointer">
        <input type="checkbox" class="chk" data-act="toggle-lab" data-id="${lab.id}" ${done?'checked':''}>
      </label>
    </div>
    <div class="flex items-center gap-2 mb-3">
      <span class="text-[10px] font-mono px-2 py-0.5 rounded-full border border-${levelColor}/30 text-${levelColor}">${lab.level}</span>
      <span class="text-[10px] font-mono text-mute">${(PHASES.find(p=>p.id===lab.phase)||{}).title||''}</span>
    </div>
    <p class="text-sm text-mute mb-3">${lab.objetivo}</p>
    <div class="grid sm:grid-cols-2 gap-3 text-xs mb-3">
      <div><span class="text-mute">Pré-requisitos:</span> ${lab.prereq.join(', ')}</div>
      <div><span class="text-mute">Ambiente:</span> ${lab.ambiente}</div>
    </div>
    <div class="card-2 rounded-lg p-3 mb-3">
      <div class="text-[11px] font-mono text-cyan mb-1.5">DESAFIO</div>
      <p class="text-sm text-ink">${lab.desafio}</p>
    </div>
    <div class="space-y-1.5 mb-3">
      ${lab.passos.map((s,i)=>`<div class="text-xs text-mute flex gap-2"><span class="font-mono text-mute/70">${i+1}.</span>${s}</div>`).join('')}
    </div>
    <div class="flex flex-wrap gap-2 mb-2">
      ${lab.hints.map((h,i)=>`
        <button data-act="show-hint" data-lab="${lab.id}" data-i="${i}" class="hint-btn text-xs px-3 py-1.5 rounded-full text-mute hover:text-amber ${ui.hints>i?'hidden':''}">💡 Hint ${i+1}</button>
      `).join('')}
      ${!ui.solution?`<button data-act="show-solution" data-lab="${lab.id}" class="hint-btn text-xs px-3 py-1.5 rounded-full text-mute hover:text-green">✅ Ver solução</button>`:''}
    </div>
    <div class="space-y-2">
      ${lab.hints.slice(0,ui.hints).map((h,i)=>`<div class="text-xs card-2 rounded-lg p-2.5 text-amber/90 border-amber/20">💡 ${h}</div>`).join('')}
      ${ui.solution?`<div class="text-xs card-2 rounded-lg p-2.5 text-green/90 border-green/20">✅ ${lab.solucao}</div>`:''}
    </div>
    ${ui.solution?`
    <div class="mt-3 pt-3 border-t border-line text-xs text-mute">
      <div class="mb-1"><span class="text-ink">Documentar:</span> ${lab.documentar.join(' · ')}</div>
      <div><span class="text-ink">Publicar:</span> ${lab.publicar}</div>
    </div>`:''}
  </div>`;
}
function bindLabs(){
  document.querySelectorAll('[data-act="toggle-lab"]').forEach(cb=>cb.addEventListener('change', ()=>{
    if(cb.checked) STATE.labsDone[cb.dataset.id]=true; else delete STATE.labsDone[cb.dataset.id];
    saveState(); render();
  }));
  document.querySelectorAll('[data-act="show-hint"]').forEach(b=>b.addEventListener('click', ()=>{
    const ui = labUiState[b.dataset.lab]; ui.hints = Math.max(ui.hints, Number(b.dataset.i)+1);
    document.getElementById('lab-'+b.dataset.lab).outerHTML = renderLabCard(LABS.find(l=>l.id===b.dataset.lab));
    bindLabs();
  }));
  document.querySelectorAll('[data-act="show-solution"]').forEach(b=>b.addEventListener('click', ()=>{
    labUiState[b.dataset.lab].solution = true;
    document.getElementById('lab-'+b.dataset.lab).outerHTML = renderLabCard(LABS.find(l=>l.id===b.dataset.lab));
    bindLabs();
  }));
}

/* =========================================================================
   REVISÃO ESPAÇADA
   ========================================================================= */
const REVIEW_INTERVALS = [1,7,30,60];
function renderRevisao(){
  const due = STATE.reviewCards.filter(c=>new Date(c.nextDue) <= new Date());
  const upcoming = STATE.reviewCards.filter(c=>new Date(c.nextDue) > new Date());
  return `
  ${sectionHeader('Modo Revisão', 'Revisão espaçada de comandos, conceitos e cenários de troubleshooting — 1 dia, 7, 30 e 60 dias.', `<button data-act="add-review-card" class="text-xs px-3 py-2 rounded-lg bg-cyan/10 border border-cyan/30 text-cyan flex items-center gap-1.5">${icon('plus','w-3.5 h-3.5')}Novo card</button>`)}
  <div id="review-form-root"></div>
  <h2 class="font-display text-sm font-semibold mb-3">Para revisar hoje (${due.length})</h2>
  <div class="grid md:grid-cols-2 gap-3 mb-6">
    ${due.length===0?`<p class="text-sm text-mute">Nada pendente hoje.</p>`:due.map(c=>renderReviewCard(c)).join('')}
  </div>
  <h2 class="font-display text-sm font-semibold mb-3">Próximas (${upcoming.length})</h2>
  <div class="grid md:grid-cols-2 gap-3">
    ${upcoming.map(c=>`<div class="card rounded-xl p-4 opacity-60"><div class="text-xs text-mute mb-1">${c.category} · próxima em ${c.nextDue}</div><div class="text-sm text-ink">${c.front}</div></div>`).join('')}
  </div>`;
}
function renderReviewCard(c){
  const flipped = !!c._flipped;
  return `
  <div class="card rounded-xl p-4" id="rev-${c.id}">
    <div class="text-[10px] font-mono text-mute mb-2">${c.category}</div>
    <div class="text-sm text-ink mb-3">${c.front}</div>
    ${flipped?`<div class="text-xs card-2 rounded-lg p-2.5 mb-3">${c.back}</div>`:`<button data-act="flip-card" data-id="${c.id}" class="text-xs text-cyan hover:underline mb-3">Mostrar resposta</button>`}
    ${flipped?`
    <div class="flex gap-2">
      <button data-act="review-result" data-id="${c.id}" data-ok="0" class="flex-1 text-xs px-3 py-1.5 rounded-lg border border-red/30 text-red">Não lembrei</button>
      <button data-act="review-result" data-id="${c.id}" data-ok="1" class="flex-1 text-xs px-3 py-1.5 rounded-lg border border-green/30 text-green">Lembrei</button>
    </div>`:''}
  </div>`;
}
function bindRevisao(){
  const addBtn = document.querySelector('[data-act="add-review-card"]');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    document.getElementById('review-form-root').innerHTML = `
    <form id="review-form" class="card rounded-xl p-4 mb-5 grid sm:grid-cols-2 gap-3">
      <input name="category" placeholder="Categoria (ex.: Redes)" required class="rounded-lg px-3 py-2 text-sm focus-ring">
      <input name="front" placeholder="Pergunta / comando" required class="rounded-lg px-3 py-2 text-sm focus-ring">
      <textarea name="back" placeholder="Resposta / explicação" required class="sm:col-span-2 rounded-lg px-3 py-2 text-sm focus-ring" rows="2"></textarea>
      <button class="sm:col-span-2 bg-cyan/10 border border-cyan/30 text-cyan text-sm rounded-lg py-2">Adicionar ao ciclo de revisão</button>
    </form>`;
    document.getElementById('review-form').addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      STATE.reviewCards.push({id:'rc-'+Date.now(), category:fd.get('category'), front:fd.get('front'), back:fd.get('back'), interval:0, nextDue:todayStr()});
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-act="flip-card"]').forEach(b=>b.addEventListener('click', ()=>{
    const c = STATE.reviewCards.find(x=>x.id===b.dataset.id); c._flipped = true;
    document.getElementById('rev-'+c.id).outerHTML = renderReviewCard(c); bindRevisao();
  }));
  document.querySelectorAll('[data-act="review-result"]').forEach(b=>b.addEventListener('click', ()=>{
    const c = STATE.reviewCards.find(x=>x.id===b.dataset.id);
    const ok = b.dataset.ok==='1';
    const idx = ok ? Math.min(c.interval+1, REVIEW_INTERVALS.length-1) : 0;
    c.interval = idx;
    const days = REVIEW_INTERVALS[idx];
    const d = new Date(); d.setDate(d.getDate()+days);
    c.nextDue = d.toISOString().slice(0,10);
    c._flipped = false;
    saveState(); render();
  }));
}

/* =========================================================================
   ENTREVISTAS
   ========================================================================= */
const qUiState = {};
function renderEntrevistas(){
  const cats = [...new Set(INTERVIEW_QUESTIONS.map(q=>q.cat))];
  return `
  ${sectionHeader('Preparação para Entrevistas', 'Perguntas práticas de infraestrutura, rede, segurança e comportamental. Pense antes de revelar a resposta.')}
  ${cats.map(cat=>`
    <div class="mb-6">
      <h2 class="font-display text-sm font-semibold mb-3">${cat}</h2>
      <div class="space-y-3">
        ${INTERVIEW_QUESTIONS.filter(q=>q.cat===cat).map(q=>renderQCard(q)).join('')}
      </div>
    </div>`).join('')}`;
}
function renderQCard(q){
  const shown = !!qUiState[q.id];
  const difColor = q.dif==='Fácil'?'green':q.dif==='Média'?'amber':'red';
  return `
  <div class="card rounded-xl p-4" id="q-${q.id}">
    <div class="flex items-center justify-between gap-3 mb-1.5">
      <p class="text-sm text-ink font-medium">${q.q}</p>
      <span class="text-[10px] font-mono px-2 py-0.5 rounded-full border border-${difColor}/30 text-${difColor} shrink-0">${q.dif}</span>
    </div>
    ${!shown?`<button data-act="show-answer" data-id="${q.id}" class="text-xs text-cyan hover:underline">Mostrar resposta</button>`:`<div class="text-xs card-2 rounded-lg p-2.5 mt-2">${q.a}</div>`}
  </div>`;
}
function bindEntrevistas(){
  document.querySelectorAll('[data-act="show-answer"]').forEach(b=>b.addEventListener('click', ()=>{
    qUiState[b.dataset.id]=true;
    document.getElementById('q-'+b.dataset.id).outerHTML = renderQCard(INTERVIEW_QUESTIONS.find(q=>q.id===b.dataset.id));
    bindEntrevistas();
  }));
}

        <input name="objetivo" value="${p.objetivo}" class="w-full rounded-lg px-3 py-2 text-sm focus-ring">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-mute mb-1">Horas/semana</label>
          <input name="horas" type="number" value="${p.horas}" class="w-full rounded-lg px-3 py-2 text-sm focus-ring">
        </div>
        <div>
          <label class="block text-xs text-mute mb-1">País-alvo</label>
          <input name="paisAlvo" value="${p.paisAlvo}" class="w-full rounded-lg px-3 py-2 text-sm focus-ring">
        </div>
      </div>
      <div>
        <label class="block text-xs text-mute mb-1">Avatar (emoji)</label>
        <input name="avatar" value="${p.avatar}" maxlength="2" class="w-20 rounded-lg px-3 py-2 text-sm text-center focus-ring">
      </div>
      <button class="bg-cyan text-void font-medium text-sm rounded-lg px-4 py-2.5">Salvar</button>
    </form>
    <div class="card rounded-xl p-5">
      <h2 class="font-display text-sm font-semibold mb-3">Dados</h2>
      <p class="text-xs text-mute mb-4">Seu progresso é salvo localmente no navegador (localStorage) deste dispositivo. Não há sincronização entre dispositivos nesta versão — a estrutura de dados já está separada da interface para conectar um backend (ex.: Supabase) depois, sem reescrever a aplicação.</p>
      <div class="flex flex-wrap gap-2">
        <button data-act="export-data" class="text-xs px-3.5 py-2 rounded-lg border border-line text-mute hover:text-cyan">Exportar dados (.json)</button>
        <button data-act="reset-data" class="text-xs px-3.5 py-2 rounded-lg border border-red/30 text-red">Resetar tudo</button>
      </div>
    </div>
  </div>`;
}
function bindConfig(){
  document.getElementById('config-form').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    Object.assign(STATE.profile, {
      name:fd.get('name'), objetivo:fd.get('objetivo'), horas:fd.get('horas'),
      paisAlvo:fd.get('paisAlvo'), avatar:fd.get('avatar')||'🐧',
    });
    saveState(); render();
  });
  const exp = document.querySelector('[data-act="export-data"]');
  if(exp) exp.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='karlinux-dados.json'; a.click();
    URL.revokeObjectURL(url);
  });
  const rst = document.querySelector('[data-act="reset-data"]');
  if(rst) rst.addEventListener('click', ()=>{
    if(confirm('Isso apaga todo o progresso salvo neste navegador. Confirmar?')){
      STATE = defaultState(); saveState(); location.hash='#dashboard'; render();
    }
  });
}
</script>
